<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #14131b;
        color: #ececf1;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: #6b6877; flex: none; }
      .dot.ok { background: #3bb2b4; }
      .dot.bad { background: #f06a6a; }
      .url {
        margin: 6px 0 12px;
        font-size: 11px;
        color: #9a97a8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 52px;
        resize: vertical;
        border: 1px solid #2c2b3a;
        background: #1c1b26;
        color: #ececf1;
        border-radius: 8px;
        padding: 7px 9px;
        font: inherit;
        margin-bottom: 9px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 9px;
        font: inherit;
        font-weight: 600;
        color: #14121d;
        background: linear-gradient(135deg, #7a6dff, #9a8dff);
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      .row a {
        flex: 1;
        text-align: center;
        font-size: 11px;
        color: #9a97a8;
        text-decoration: none;
        padding: 5px;
        border: 1px solid #2c2b3a;
        border-radius: 7px;
      }
      .row a:hover { color: #ececf1; }
      #msg { margin-top: 9px; font-size: 11px; min-height: 14px; }
      #msg.ok { color: #3bb2b4; }
      #msg.bad { color: #f06a6a; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> Save to MirrorMind</h1>
    <div class="url" id="url">…</div>
    <textarea id="note" placeholder="Optional note to save instead of the page…"></textarea>
    <button id="save">Save this page</button>
    <div id="msg"></div>
    <div class="row">
      <a href="https://mirror-mindai.vercel.app/timeline" target="_blank">Open MirrorMind</a>
      <a href="#" id="opts">Settings</a>
    </div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
